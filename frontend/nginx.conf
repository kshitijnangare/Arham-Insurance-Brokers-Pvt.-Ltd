server {
    listen 80;
    server_name _;

    # Serve built React/Vite static assets
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all non-asset routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the Express backend container
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;

        # Required headers for proxying
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── SSE-specific settings ──────────────────────────────────────────
        # Disable buffering so SSE events flow through immediately
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     86400s;  # 24h — keeps SSE connections alive
        proxy_send_timeout     86400s;

        # Required for SSE: keep the upstream connection alive
        proxy_set_header   Connection        '';
        chunked_transfer_encoding on;
    }

    # Gzip static assets for faster delivery
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets aggressively (Vite hashes asset filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }
}

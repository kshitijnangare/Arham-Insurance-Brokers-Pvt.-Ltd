services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: bse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ftat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ftat_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bse-network

  # ─── Redis Message Broker (BullMQ) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bse-network

  # ─── Express Backend + Worker ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bse_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: ftat_db
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      BSE_PULL_DELAY_MS: "900000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bse-network

  # ─── React Frontend (Nginx Reverse Proxy) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bse_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - bse-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bse-network:
    driver: bridge
